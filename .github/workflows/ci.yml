name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Black
        run: find euclid_dsps scripts -name '*.py' -exec python -m black --check {} \;

      - name: Ruff
        run: python -m ruff check euclid_dsps scripts

      - name: Compile
        run: python -m compileall euclid_dsps scripts/quickstart_one_galaxy.py

      - name: Sphinx
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
