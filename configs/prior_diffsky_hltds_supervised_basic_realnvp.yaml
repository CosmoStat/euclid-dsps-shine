extends: amortized_diffsky_hltds_04_14_realnvp_gpu.yaml

calibration:
    global_sed_scale:
        enabled: false
        mode: disabled
        parameterization: log_alpha
        initial_log_alpha: 0.0
        prior_sigma_log_alpha: 0.10
        trainable: false
    per_band_zero_points:
        enabled: false

prior_learning:
    dataset: Data/diffsky/processed/hltds_cosmos_260215_04_14_2026_continuous_lowz_fluxerr.parquet
    schema: diffsky_truth_basic
    missing_policy: reduce
    bounds:
        z_obs: [0.001, 0.5]
        log10_stellar_mass: [6.0, 13.5]
        log10_ssfr_at_obs: [-14.5, -7.0]
        log10_sfr_at_obs: [-5.0, 4.0]
        dust_av: [0.0, 5.0]
        dust_delta: [-2.5, 1.0]
    flow:
        type: realnvp
        n_layers: 8
        hidden_size: 128
        scale_clamp: 0.05
    training:
        epochs: 30
        batch_size: 512
        learning_rate: 1.0e-3
        weight_decay: 1.0e-5
        gradient_clip_norm: 1.0
        validation_fraction: 0.1
        seed: 42
        epoch_shuffle: true
    output:
        prior_samples: 8192
        truth_sample_limit: 200000
