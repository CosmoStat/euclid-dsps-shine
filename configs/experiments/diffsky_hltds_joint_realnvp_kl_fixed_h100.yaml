extends: diffsky_hltds_joint_realnvp_photoz_h100.yaml

experiment:
    name: diffsky_hltds_joint_realnvp_kl_fixed_h100
    description: Fixed small-KL Diffsky HLTDS joint RealNVP run on the balanced20k diagnostic rowset.

amortized:
    prior:
        update_schedule: alternating
        freeze_epochs: 0
        update_every_epochs: 1
    training:
        epochs: 20
        n_samples: 4
        kl_annealing_epochs: 0
        kl_weight_max: 0.01
        best_checkpoint_metric: validation_loss
        best_checkpoint_min_epoch: 5
        likelihood_temperature_initial: 1.0
        likelihood_temperature_final: 1.0
        likelihood_temperature_annealing_epochs: 0
    posterior_regularization:
        entropy_floor_enabled: true
        min_log_std: -3.5
        weight: 0.03
        final_weight: 0.03
        anneal_epochs: 0
    prior_predictive_diagnostics:
        enabled: true
        n_prior_samples: 512
        n_observed: 5000
        batch_size: 256
