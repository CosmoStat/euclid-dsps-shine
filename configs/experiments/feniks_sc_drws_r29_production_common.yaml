amortized:
  sc_drws:
    profile: full_production_anti_collapse_v1
    phase_a:
      sleep_only_bootstrap_epochs: 16
    schedule:
      q_weight_temperature_wake_updates: 640
      adaptive_q_weight_temperature:
        enabled: true
        minimum_median_ess_fraction: 0.025
        low_support_temperature_cap: 0.65
        force_to_one_start_epoch: 100
        force_to_one_end_epoch: 135
    phase_a_hard_mis:
      enabled: true
      first_particles: 64
      additional_particles: 192
      maximum_particles: 256
      minimum_ess_fraction: 0.05
      maximum_weight: 0.90
      proposal:
        - {source: posterior, temperature: 1.5, fraction: 0.40}
        - {source: posterior, temperature: 2.5, fraction: 0.45}
        - {source: prior, temperature: 1.0, fraction: 0.15}
    optimizer:
      q_warmup_peak_learning_rate: 5.0e-5
      q_joint_learning_rate: 3.0e-5
      schedule:
        enabled: true
        warmup_fraction: 0.05
        phase_a:
          initial_learning_rate: 3.0e-6
          end_learning_rate: 1.0e-5
        phase_b:
          initial_learning_rate: 3.0e-6
          end_learning_rate: 1.0e-5
    flow_optimizer:
      freeze_epochs: 12
      thaw_end_epoch: 40
      final_gradient_multiplier: 0.50
    entropy:
      apply_during_phase_a_after_bootstrap: true
      bootstrap_reference_epoch: 16
    checkpoint_safety:
      enabled: true
      probe_objects: 128
      probe_particles: 128
      minimum_epoch: 64
      maximum_entropy_drop: 3.0
      minimum_relative_ess_before_rollback: 0.50
      restore_best_at_end: true
      role: truth_free_training_safety_only
    performance:
      fixed_particle_shapes: [64, 128, 256, 512, 2048]
