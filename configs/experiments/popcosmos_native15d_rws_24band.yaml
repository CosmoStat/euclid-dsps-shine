extends: popcosmos_native15d_rws.yaml

# Controlled ablation: remove only the two IRAC bands while keeping the
# native 15D latent, filters, errors, likelihood and RWS schedule unchanged.
dataset:
  name: cosmos2020_farmer_native15d_24band_no_irac
  band_subset: cosmos24_no_irac

bands:
  - {name: u_megaprime_sagem, column: flux_u_megaprime_sagem, error_column: fluxerr_u_megaprime_sagem, units: microjy, filter: {kind: ascii, path: Data/cosmos2020/assets/filters/u_megaprime_sagem.dat}}
  - {name: hsc_g, column: flux_hsc_g, error_column: fluxerr_hsc_g, units: microjy, filter: {kind: ascii, path: Data/cosmos2020/assets/filters/hsc_g.dat}}
