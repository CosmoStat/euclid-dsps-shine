extends: feniks_conditional_posterior_common.yaml
amortized:
  objective: {mode: neural_posterior_estimation}
  encoder:
    type: conditional_flow
    flow_family: realnvp
    flow_layers: 4
    flow_hidden_size: 128
    flow_init_scale: 0.0
  training: {epochs: 200, learning_rate: 3.0e-4, kl_annealing_epochs: 0, kl_weight_max: 0.0}
