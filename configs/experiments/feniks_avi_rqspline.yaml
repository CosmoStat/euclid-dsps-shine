extends: feniks_conditional_posterior_common.yaml
amortized:
  objective: {mode: stochastic_elbo}
  encoder:
    type: conditional_flow
    flow_family: rq_spline
    flow_layers: 4
    flow_hidden_size: 128
    flow_bins: 8
    flow_tail_bound: 8.0
    flow_init_scale: 0.0
  training: {epochs: 120, learning_rate: 1.0e-4, kl_annealing_epochs: 40, kl_weight_max: 1.0}
