extends: feniks_rws_recovery_r25_common.yaml

truth:
  parameter_columns:
    __replace__: true

amortized:
  encoder:
    log_std_min: -4.0
    log_std_max: 2.5
    initial_log_std: 0.25
    flow_init_scale: 0.0

  prior:
    source: joint_realnvp
    checkpoint: null
    train_jointly: true
    init: identity
    init_scale: 0.0

  likelihood:
    type: gaussian
    error_floor_frac: 0.0
    error_jitter: 0.0

  objective:
    mode: reweighted_wake_sleep
    npe_weight: 0.0
    prior_truth_weight: 0.0
    wake:
      sampler: defensive_multiple_importance
      train_encoder: true
      train_prior: true
      selection_in_object_weights: false
    sleep:
      enabled: true
      error_model: observed_catalog
      noise_family: match_likelihood
      entropy_samples: 4
      selection:
        enabled: true
        band: lsst_r
        max_mag_ab: 29.0
        candidate_factor: 8
    selection_correction:
      enabled: true
      kind: observed_magnitude_limit
      band: lsst_r
      max_mag_ab: 29.0
      survey_noise: gaussian_m5
      gradient_estimator: score_function
      score_control_variate: centered
      n_prior_samples: 4096
      prior_sample_batch_size: 256
      gradient_preflight_samples: 512
      common_random_numbers: true
      seed: 260827

  sc_drws:
    name: Selection-Corrected Defensive Reweighted Wake-Sleep
    acronym: SC-DRWS
    c0_scope_statement: We infer the parent distribution within the predefined FENIKS refinement and catalogue-support domain, while explicitly correcting the additional observed r<29.0 selection.
    target_population: p_eta(theta | C0)
    selected_population: beta(theta) * p_eta(theta | C0) / alpha_eta
    observed_selection: A = 1[m_r_observed < 29.0]
    upstream_true_space_selection: conditioned_as_C0_not_inverted
    dataset_regeneration: forbidden
    truth_allowed: false
    production_entrypoint: scripts/train_feniks_sc_drws.py
    legacy_generic_rws_trainer_allowed: false
    phase_a:
      epochs: 60
      likelihood: student_t
      student_t_dof: 2.0
      prior_frozen: true
      wake_particles: 64
      proposal:
        - {source: posterior, temperature: 1.0, fraction: 0.55}
        - {source: posterior, temperature: 1.5, fraction: 0.30}
        - {source: posterior, temperature: 2.5, fraction: 0.10}
        - {source: prior, temperature: 1.0, fraction: 0.05}
    phase_b:
      epochs: 120
      likelihood: gaussian
      prior_frozen: false
      wake_particles: 128
      proposal:
        - {source: posterior, temperature: 1.0, fraction: 0.50}
        - {source: posterior, temperature: 1.5, fraction: 0.30}
        - {source: posterior, temperature: 2.5, fraction: 0.15}
        - {source: prior, temperature: 1.0, fraction: 0.05}
    schedule:
      sleep_epochs_per_cycle: 3
      wake_epochs_per_cycle: 1
      log_std_floor_start: -1.5
      log_std_floor_end: -4.0
      log_std_floor_end_epoch: 100
      flow_scale_clamp_start: 0.15
      flow_scale_clamp_end_epoch: 60
      q_weight_temperature_start: 0.50
      q_weight_temperature_end: 1.00
      q_weight_temperature_wake_updates: 80
    hard_mis:
      enabled: true
      first_particles: 128
      additional_particles: 384
      maximum_particles: 512
      minimum_ess_fraction: 0.05
      maximum_weight: 0.90
      maximum_unresolved_fraction: 0.02
      proposal:
        - {source: posterior, temperature: 1.5, fraction: 0.45}
        - {source: posterior, temperature: 2.5, fraction: 0.45}
        - {source: prior, temperature: 1.0, fraction: 0.10}
    optimizer:
      q_warmup_peak_learning_rate: 1.0e-4
      q_joint_learning_rate: 3.0e-5
      q_gradient_clip_norm: 10.0
      prior_learning_rate: 1.0e-5
      prior_gradient_clip_norm: 5.0
      weight_decay: 1.0e-6
    prior_update:
      macro_objects: 1024
      updates_per_macro: 1
      minimum_finite_objects: 128
      minimum_median_ess_fraction: 0.05
      maximum_median_weight: 0.90
      maximum_unresolved_fraction: 0.02
      trust_strength: 0.2
      trust_samples: 1024
      maximum_kl_per_dimension: 0.05
      maximum_alpha_mc_relative_error: 0.15
    entropy:
      reference: held_out_warmup_median
      margin: 1.0
      penalty_strength: 0.02
      zero_after_joint_fraction: 0.75
    ema:
      decay: 0.995
    checkpoint:
      every_epochs: 4
      support_particles: 2048
      minimum_median_ess_fraction: 0.05
      maximum_median_weight: 0.80
      maximum_fraction_pareto_k_gt_0p7: 0.20
      maximum_entropy_drop: 3.0
    performance:
      local_gpus: 4
      fixed_particle_shapes: [64, 128, 512, 2048]
      hard_objects_per_gpu_initial: 4
      target_device_memory_fraction: 0.88
      persistent_compilation_cache: true
      prefetch_host_batches: 2
      distributed_collectives_required: false

  training:
    epochs: 180
    batch_size: 256
    jax_batch_size: 64
    seed: 260827
    data_parallel: pmap
    best_checkpoint_metric: held_out_exact_gaussian_selection_corrected_iw_score

  output:
    checkpoint_every: 4
    diagnostics_every: 1
    save_training_curves: true

calibration:
  global_sed_scale:
    enabled: false
    trainable: false
  per_band_zero_points:
    enabled: false
    trainable: false
