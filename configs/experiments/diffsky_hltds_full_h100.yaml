extends: ../amortized_diffsky_hltds_joint_realnvp_gpu.yaml

experiment:
    name: diffsky_hltds_full_h100
    description: Full Diffsky HLTDS physical-validation run plan for H100-class GPUs.

full_validation:
    dataset_config: configs/diffsky_dataset_hltds_04_14.yaml
    run_supervised_priors: false
    amortized_modes:
        - standard_normal
        - joint_realnvp
    supervised_prior_basic_config: configs/prior_diffsky_hltds_supervised_basic_realnvp.yaml
    supervised_prior_extended_config: configs/prior_diffsky_hltds_supervised_extended_realnvp.yaml
    forward_closure_config: configs/diffsky_hltds_04_14_trueparam_closure_gpu.yaml
    amortized_standard_normal_config: configs/amortized_diffsky_hltds_standard_normal_gpu.yaml
    amortized_supervised_prior_config: configs/amortized_diffsky_hltds_supervised_prior_gpu.yaml
    amortized_joint_realnvp_config: configs/amortized_diffsky_hltds_joint_realnvp_gpu.yaml
    report_sections:
        - Dataset integrity
        - Same-parameter forward closure
        - Global SED scale calibration
        - Photometric posterior inference
        - Redshift ablation
        - Population realism
    global_sed_scale_reporting:
        fields:
            - alpha_sed
            - log_alpha_sed
            - delta_mag_global
            - alpha_prior_penalty
            - large_scale_warning
            - mass_bias_raw
            - mass_bias_alpha_corrected
    amortized_runtime:
        # H100 validation should not inherit the conservative CUDA safety cap
        # used by the generic Diffsky GPU configs. These values can still be
        # overridden from the CLI with --jax-batch-size and
        # --decoder-sample-chunk-size.
        jax_batch_size: 64
        decoder_sample_chunk_size: 4
        prior_predictive_batch_size: 1024
        shard_outputs: true
        resume_shards: true
        write_posterior_predictive: false
        write_residual_samples: false
        combine_sample_shards: false
        combine_summary_shards: true

calibration:
    global_sed_scale:
        enabled: true
        mode: learn_global
        parameterization: log_alpha
        initial_log_alpha: 0.0
        prior_sigma_log_alpha: 0.10
        trainable: true
    per_band_zero_points:
        enabled: false
