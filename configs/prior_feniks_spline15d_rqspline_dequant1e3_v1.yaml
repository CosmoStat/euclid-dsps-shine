spline15d_prior:
  dataset_dir: Data/diffsky/synthetic/feniks_260617_spline15d_grouped_jaxcosmo_dequant1e3_v1
  normalization:
    family: mixed_log_shifted_asinh
    positive_log_parameters:
      - z_obs
      - dust_av
    lower_quantile: 0.1586552539
    upper_quantile: 0.8413447461
    minimum_lambda: 0.000001
  preprocessing:
    target_table: projected
    expected_physical_atom_half_width_dex: 0.001
    normalized_atom_half_width: 0.0
    atom_seed: 260717
    whitening: false
    covariance_jitter: 0.00001
    require_zero_exact_overlap: true
  flow:
    type: rq_spline_coupling
    n_layers: 16
    hidden_size: 384
    n_bins: 16
    tail_bound: 12.0
    min_bin_width: 0.001
    min_bin_height: 0.001
    min_derivative: 0.001
    permutation: roll
    init: identity
    init_scale: 0.0
  training:
    epochs: 120
    batch_size: 1024
    learning_rate: 0.0003
    weight_decay: 0.00001
    gradient_clip_norm: 5.0
    base_moment_weight: 0.0
    training_jitter_std: 0.0
    early_stopping_patience: 0
    epoch_shuffle: true
    data_parallel: single
    seed: 260717
  evaluation:
    checkpoint_selection: validation_nll
    every_epochs: 1
    sample_count: 10000
    max_median_ks: 0.10
    max_max_ks: 0.22
    max_correlation_frobenius: 1.5
    min_base_std_mean: 0.8
    max_base_std_mean: 1.2
    max_normalized_tail_fraction: 0.003
    max_negative_fraction: 0.01
    max_scale_saturation_fraction: 0.20
    max_sliced_wasserstein: 0.25
    temperature_min: 1.0
    temperature_max: 1.0
    temperature_step: 1.0
    include_unit_temperature: true
  snapshots:
    enabled: true
    every_epochs: 5
    sample_count: 10000
    save_samples: true
    save_checkpoints: true
  output:
    prior_samples: 50000
    truth_sample_limit: 50000
    max_corner_rows: 4000
