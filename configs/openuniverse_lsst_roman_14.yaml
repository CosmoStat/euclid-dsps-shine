extends: popcosmos_binned_compressed.yaml

catalog_path: Data/openuniverse/processed/ou_lsst_roman_14.parquet
runtime: cpu
bands: openuniverse_lsst_roman_14
column_groups: []
extra_columns: []

openuniverse:
    input_root: Data/openuniverse/raw
    hpix_ids: []
    output_path: Data/openuniverse/processed/ou_lsst_roman_14.parquet
    min_flux_valid_bands: 8
    seed: 42
    noise_model:
        type: fractional_snr
        snr: 50

selection:
    index: 0
    require_positive_flux: false
    nondetection_policy: gaussian_flux
    sort_by_flux:

redshift:
    initial: catalog_column
    column: redshift
    truth_column: redshift
    fixed_value: 0.5
    min: 0.0001
    max: 6.0
    seed: 42
    prior_z:
        mode: none

truth:
    redshift_column: redshift
    parameter_columns:
        redshift_hubble:
            column: redshiftHubble
        stellar_mass:
            column: stellar_mass

reporting:
    level: light
    save_sed_samples: 0
    plot_filters: false
    plot_ground_truth: false

output:
    format: parquet
