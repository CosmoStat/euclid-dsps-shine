spline15d_prior:
  dataset_dir: Data/diffsky/synthetic/feniks_260617_spline15d_grouped_v3
  normalization:
    family: asinh
    log10_lambda_min: -8.0
    log10_lambda_max: 8.0
    grid_size: 257
  preprocessing:
    normalized_atom_half_width: 0.05
    atom_seed: 260716
    whitening: true
    covariance_jitter: 0.00001
    require_zero_exact_overlap: true
  flow:
    type: realnvp
    n_layers: 12
    hidden_size: 256
    scale_clamp: 0.5
    shift_clamp: 2.0
    permutation: roll
    init: identity
    init_scale: 0.0
  training:
    epochs: 80
    batch_size: 1024
    learning_rate: 0.0001
    weight_decay: 0.000001
    gradient_clip_norm: 5.0
    base_moment_weight: 0.0
    training_jitter_std: 0.01
    early_stopping_patience: 12
    epoch_shuffle: true
    data_parallel: auto
    seed: 260716
  evaluation:
    every_epochs: 1
    sample_count: 10000
    max_median_ks: 0.10
    max_max_ks: 0.22
    max_correlation_frobenius: 1.5
    min_base_std_mean: 0.8
    max_base_std_mean: 1.2
    max_normalized_tail_fraction: 0.003
    max_negative_fraction: 0.01
    max_scale_saturation_fraction: 0.20
    max_sliced_wasserstein: 0.25
    baseline_median_ks_tolerance: 0.01
    baseline_sliced_wasserstein_tolerance: 0.02
    baseline_score_min_improvement: 0.005
    # Production uses the learned density at unit temperature only.
    temperature_min: 1.0
    temperature_max: 1.0
    temperature_step: 1.0
    include_unit_temperature: true
  output:
    prior_samples: 50000
    truth_sample_limit: 50000
    max_corner_rows: 4000
