catalog_path: "Data/Euclid FS2 LC galaxy catalog_phz1.parquet"
ssp_path: "Data/ssp_data_fsps_v3.2_lgmet_age.h5"

runtime:
    # WSL-safe default. For a working CUDA JAX install, use:
    # jax_platforms: "cuda,cpu"
    # disable_jax_plugin_autoload: false
    jax_platforms: "cuda"
    disable_jax_plugin_autoload: false
    xla_python_client_preallocate: false
    require_gpu: true

selection:
    index: 0
    require_positive_flux: true
    sort_by_flux:

eda:
    nrows:

extra_columns:
    - ra_gal
    - dec_gal
    - ra_mag_gal
    - dec_mag_gal
    - sed_cosmos_1
    - sed_cosmos_2
    - frac_cosmos_1
    - frac_cosmos_2
    - color_kind
    - euclid_vis_abs
    - euclid_nisp_y_abs
    - euclid_nisp_j_abs
    - euclid_nisp_h_abs
    - euclid_vis_el_model3_ext
    - euclid_nisp_y_el_model3_ext
    - euclid_nisp_j_el_model3_ext
    - euclid_nisp_h_el_model3_ext
    - euclid_vis_el_model3_ext_odonnell_ext
    - euclid_nisp_y_el_model3_ext_odonnell_ext
    - euclid_nisp_j_el_model3_ext_odonnell_ext
    - euclid_nisp_h_el_model3_ext_odonnell_ext
    - euclid_vis_el_model3_ext_odonnell_ext_error
    - euclid_nisp_y_el_model3_ext_odonnell_ext_error
    - euclid_nisp_j_el_model3_ext_odonnell_ext_error
    - euclid_nisp_h_el_model3_ext_odonnell_ext_error
    - euclid_vis_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_y_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_j_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_h_el_model3_ext_odonnell_ext_error_realization
    - z_true_gal
    - z_obs_gal
    - redshift_step
    - z_deepz
    - phz_flags
    - phz_median
    - phz_min_70
    - phz_max_70
    - phz_min_90
    - phz_max_90
    - phz_min_95
    - phz_max_95
    - phz_mode_1_area
    - phz_mode_2
    - phz_mode_2_area
    - log_stellar_mass
    - log_ml_r01
    - abs_mag_r01
    - log_luminosity_r01
    - abs_mag_uv_unextincted
    - ebv_cosmos_1
    - ebv_cosmos_2
    - ext_curve_cosmos_1
    - ext_curve_cosmos_2
    - mw_extinction
    - bulge_fraction
    - disk_r50
    - bulge_r50
    - eps1_gal
    - eps2_gal
    - disk_ellipticity
    - bulge_ellipticity
    - bulge_nsersic
    - disk_nsersic
    - lm_halo
    - lmbound_halo
    - r_halo
    - conc_vir_halo
    - rs_halo
    - rvir_halo
    - n_sats_halo
    - num_p_halo

cosmos_sed:
    value_added_data_dir: "Data/value_added_data"
    catalog_h: 0.67
    lephare_data_dir: "/home/maxime/.cache/lephare/data"
    template_subdir: "sed/GAL/COSMOS_SED"
    template_list: "COSMOS_MOD.list"
    expected_template_count: 31
    template_wave_unit: angstrom
    template_flux_unit: arbitrary_flambda
    extinction_dir: "ext"
    extinction:
        curves:
            0: none
            1: SMC_prevot
            2: SB_calzetti
            3: SB_calzetti_bump1
            4: SB_calzetti_bump2
    component_fraction_policy: strict
    filter_response_kind: photon
    comparison_wave_min_angstrom: 1000.0
    comparison_wave_max_angstrom: 30000.0
    sample_plot_count: 12

redshift:
    column: phz_median
    truth_column: z_true_gal
    fixed_value: 0.5
    min: 0.0001
    max: 6.0

bands:
    - name: euclid_vis
      column: euclid_vis
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_VIS.vis.dat
    - name: euclid_nisp_y
      column: euclid_nisp_y
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.Y.dat
    - name: euclid_nisp_j
      column: euclid_nisp_j
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.J.dat
    - name: euclid_nisp_h
      column: euclid_nisp_h
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.H.dat

model:
    n_sfh_bins: 96
    fixed_parameters:
        log10_sfr: 0.0
        log10_formed_mass_msun: 10.0
        sfh_t_peak: 4.0
        sfh_tau: 0.6
        log10_metallicity: -2.0
        metallicity_scatter: 0.2
        dust_av: 0.2
        dust_slope: -0.7
    parameter_columns: {}

fit:
    method: jax_adam
    maxiter: 80
    learning_rate: 0.1
    tolerance: 1.0e-5
    patience: 18
    priors:
        z_obs:
            type: uniform
        log10_formed_mass_msun:
            type: normal
            loc: 10.0
            scale: 1.5
    population:
        prior_weight: 1.0
        sigma_floor: 0.03
        hyper_mu_scale: 5.0
        relations:
            log10_metallicity:
                predictor: log10_formed_mass_msun
                pivot: 10.0
                intercept_initial: -2.25
                slope_initial: 0.15
                sigma_initial: 0.35
                slope_scale: 0.7
    free_parameters:
        z_obs:
            initial: from_base
            bounds: [0.001, 6.0]
        log10_formed_mass_msun:
            initial: 10.0
            bounds: [6.0, 13.0]
        dust_av:
            initial: 0.2
            bounds: [0.0, 3.0]
        log10_metallicity:
            initial: -2.25
            bounds: [-3.9, -1.6]

sample:
    sampler: nuts
    num_warmup: 100
    num_samples: 200
    num_chains: 1
    chain_method: parallel
    target_accept_prob: 0.85
    max_tree_depth: 10
    num_steps: 8
    dense_mass: false
    seed: 42
    progress_bar: true
    init_from_map: true
    save_samples: true
    priors:
        z_obs:
            type: uniform
        dust_av:
            type: scaled_beta
            alpha: 1.2
            beta: 3.0
        log10_metallicity:
            type: uniform

truth:
    redshift_column: z_true_gal
    parameter_columns:
        log10_formed_mass_msun:
            column: log_stellar_mass
            transform: log_stellar_mass_h2_to_msun
            h: 0.67
        log10_metallicity:
            column: metallicity_true
            offset: -10.61
        log10_sfr_at_obs: log_sfr_true
        dust_av:
            column: dust_ebv_true
            scale: 4.05
