catalog_path: Data/diffsky/processed/hltds_cosmos_260215_04_14_2026_photometry_truth.parquet
ssp_path: Data/diffsky/raw/hltds_cosmos_260215_04_14_2026/diffsky_hltds_cosmos_260215_04_14_2026_ssp_data.hdf5

runtime: auto
bands: diffsky_hltds_lsst_roman_14_fnu_cgs
nebular_emission: ssp_flux
prior_set: flat_diffsky_basic

selection:
    index: 0
    require_positive_flux: false
    nondetection_policy: gaussian_flux
    sort_by_flux:

redshift:
    initial: random_uniform
    column:
    truth_column: redshift_true
    fixed_value: 0.5
    min: 0.001
    max: 1.2
    seed: 42
    prior_z:
        mode: none

truth:
    redshift_column: redshift_true
    parameter_columns:
        log10_stellar_mass: logsm_true
        diffstar_lgmcrit: {column: diffstar_lgmcrit, kind: generated_truth}
        diffstar_lgy_at_mcrit: {column: diffstar_lgy_at_mcrit, kind: generated_truth}
        diffstar_indx_lo: {column: diffstar_indx_lo, kind: generated_truth}
        diffstar_lg_qt: {column: diffstar_lg_qt, kind: generated_truth}
        diffstar_lg_drop: {column: diffstar_lg_drop, kind: generated_truth}
        diffstar_lg_rejuv: {column: diffstar_lg_rejuv, kind: generated_truth}
        dust_av: {column: dust_av, kind: generated_truth}
        dust_delta: {column: dust_delta, kind: generated_truth}
        logmp_true: logmp_true
        logssfr_true: logssfr_true
        logsfr_true: logsfr_true
        central_true: central_true

extra_columns:
    - object_id
    - source_file
    - source_row
    - logsm_true
    - logssfr_true
    - logsfr_true
    - logmp_true
    - central_true

model:
    n_sfh_bins: 80
    sfh_model: diffsky_basic
    sfh_time_grid: linear
    stellar_metallicity_model: single
    dust_model: prospector_fsps
    igm_model: fsps_madau95
    nebular_model: fixed_ssp
    emission_line_corrections: none
    agn_model: none
    z_sun: 0.0142
    dust_tesc_logyr: 7.0
    dust1_index: -1.0
    fixed_parameters:
        log10_stellar_metallicity: -0.2
        diffstar_indx_hi: -2.3
        diffstar_qlglgdt: -0.08
        diffmah_logm0: 12.0
        diffmah_logtc: 0.28
        diffmah_early_index: 2.4
        diffmah_late_index: 0.13
        diffmah_t_peak: 11.5
        tau1_over_tau2: 0.0

fit:
    method: jax_adam
    likelihood_space: flux
    photometric_likelihood: student_t
    student_t_dof: 2.0
    flux_error_floor_frac: 0.03
    flux_error_jitter: 0.0
    maxiter: 180
    learning_rate: 0.03
    tolerance: 1.0e-5
    patience: 32
    prior_weight: 0.5
    trace_mode: optimizer
    trace_interval: 10
    scan_unroll: 1
    batch_grad_mode: per_galaxy
    free_parameters:
        z_obs:
            initial: from_base
            bounds: [0.001, 1.2]
        log10_stellar_mass:
            initial: 10.0
            bounds: [8.0, 12.2]
        diffstar_lgmcrit:
            initial: 11.6
            bounds: [9.5, 13.0]
        diffstar_lgy_at_mcrit:
            initial: -9.7
            bounds: [-11.2, -8.2]
        diffstar_indx_lo:
            initial: 0.7
            bounds: [0.0, 3.0]
        diffstar_lg_qt:
            initial: 1.1
            bounds: [0.25, 2.05]
        diffstar_lg_drop:
            initial: -2.2
            bounds: [-3.1, 0.05]
        diffstar_lg_rejuv:
            initial: -2.0
            bounds: [-3.1, 0.05]
        dust_av:
            initial: 0.6
            bounds: [0.0, 4.0]
        dust_delta:
            initial: 0.0
            bounds: [-0.9, 0.5]

sample:
    sampler: nuts
    num_warmup: 100
    num_samples: 200
    num_chains: 1
    chain_method: parallel
    target_accept_prob: 0.85
    max_tree_depth: 10
    num_steps: 8
    dense_mass: false
    seed: 42
    progress_bar: true
    init_from_map: true
    save_samples: true
    priors: {}

reporting:
    level: light
    save_sed_samples: 0
    plot_filters: false
    plot_ground_truth: false

output:
    format: parquet
    verbose_benchmark: true
