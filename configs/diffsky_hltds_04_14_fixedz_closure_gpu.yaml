catalog_path: Data/diffsky/processed/hltds_cosmos_260215_04_14_2026_photometry_truth_noerr.parquet
ssp_path: Data/diffsky/raw/hltds_cosmos_260215_04_14_2026/diffsky_hltds_cosmos_260215_04_14_2026_ssp_data.hdf5

runtime: gpu
bands: diffsky_hltds_lsst_roman_14_abmag_modelerr
nebular_emission: ssp_flux

selection:
    index: 0
    require_positive_flux: false
    nondetection_policy: gaussian_flux
    sort_by_flux:

redshift:
    initial: catalog_column
    column: redshift_true
    truth_column: redshift_true
    fixed_value: 0.98
    min: 0.5
    max: 1.3
    seed: 42
    prior_z:
        mode: none

truth:
    redshift_column: redshift_true
    parameter_columns:
        log10_stellar_mass: {column: logsm_true, kind: truth}
        log10_sfr_at_obs: {column: logsfr_true, kind: truth}

extra_columns:
    - object_id
    - source_file
    - source_row
    - logsm_true
    - logssfr_true
    - logsfr_true
    - logmp_true
    - logmp_host_true
    - central_true
    - r50_disk_true
    - r50_bulge_true

model:
    n_sfh_bins: 80
    sfh_model: popcosmos_bins
    sfh_time_grid: prospector_step
    stellar_metallicity_model: single
    dust_model: prospector_fsps
    igm_model: fsps_madau95
    nebular_model: fixed_ssp
    emission_line_corrections: none
    agn_model: none
    asset_metadata_policy: permissive
    z_sun: 0.0142
    dust_tesc_logyr: 7.0
    dust1_index: -1.0
    fixed_parameters:
        dlog10_sfr_2: 0.0
        dlog10_sfr_3: 0.0
        dlog10_sfr_4: 0.0
        dlog10_sfr_5: 0.0
        dlog10_sfr_6: 0.0
        log10_stellar_metallicity: -0.2
        tau1_over_tau2: 0.0

fit:
    method: jax_adam
    likelihood_space: mag
    photometric_likelihood: student_t
    student_t_dof: 2.0
    flux_error_floor_frac: 0.0
    flux_error_jitter: 0.0
    maxiter: 180
    learning_rate: 0.02
    tolerance: 1.0e-5
    patience: 40
    prior_weight: 1.0
    trace_mode: optimizer
    trace_interval: 20
    scan_unroll: 1
    batch_grad_mode: per_galaxy
    free_parameters:
        log10_stellar_mass:
            initial: 10.0
            bounds: [7.5, 12.5]
        dlog10_sfr_1:
            initial: 0.0
            bounds: [-3.0, 3.0]
        tau2:
            initial: 0.3
            bounds: [0.0, 4.0]
        dust_index_n:
            initial: -0.7
            bounds: [-2.0, 0.5]

sample:
    sampler: nuts
    num_warmup: 100
    num_samples: 200
    num_chains: 1
    chain_method: parallel
    target_accept_prob: 0.85
    max_tree_depth: 10
    num_steps: 8
    dense_mass: false
    seed: 42
    progress_bar: true
    init_from_map: true
    save_samples: true
    priors: {}

reporting:
    level: light
    save_sed_samples: 0
    plot_filters: false
    plot_ground_truth: false

output:
    format: parquet
    verbose_benchmark: true
