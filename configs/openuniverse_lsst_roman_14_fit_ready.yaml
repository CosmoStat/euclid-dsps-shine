extends: openuniverse_lsst_roman_14.yaml

catalog_path: Data/openuniverse/processed/ou_lsst_roman_14_subset_fit_ready.parquet
bands: openuniverse_lsst_roman_14_fnu_cgs

redshift:
    initial: random_uniform
    column: redshift
    truth_column: redshift
    fixed_value: 0.5
    min: 0.001
    max: 2.5
    seed: 42
    prior_z:
        mode: none

openuniverse:
    input_root: Data/openuniverse/raw
    output_path: Data/openuniverse/processed/ou_lsst_roman_14_subset.parquet
    fit_ready_path: Data/openuniverse/processed/ou_lsst_roman_14_subset_fit_ready.parquet
    fit_ready_manifest: Data/openuniverse/processed/ou_lsst_roman_14_subset_fit_ready.manifest.yaml
    source_flux_unit: photon_per_sec_cm2
    photometry_unit: fnu_cgs
    lensing_mode: unlensed
    filter_response_mode: dsps_clipped

truth:
    redshift_column: redshift
    parameter_columns:
        redshift_hubble:
            column: redshiftHubble
        stellar_mass:
            column: stellar_mass
        log10_stellar_mass:
            column: stellar_mass
            transform: log10
        mu_lensing:
            column: mu_lensing

fit:
    learning_rate: 0.005
    maxiter: 120
    patience: 30
    trace_mode: optimizer
    trace_interval: 5
    free_parameters:
        z_obs:
            initial: from_base
            bounds: [0.001, 2.5]
        log10_stellar_mass:
            initial: 8.0
            bounds: [5.0, 13.0]

reporting:
    level: full
