extends: diffsky_hltds_04_14_fit_basic.yaml

truth:
    redshift_column: redshift_true
    parameter_columns:
        log10_stellar_mass: logsm_true
        diffstar_lgmcrit: {column: diffstar_lgmcrit, kind: generated_truth}
        diffstar_lgy_at_mcrit: {column: diffstar_lgy_at_mcrit, kind: generated_truth}
        diffstar_indx_lo: {column: diffstar_indx_lo, kind: generated_truth}
        diffstar_indx_hi: {column: diffstar_indx_hi, kind: generated_truth}
        diffstar_lg_qt: {column: diffstar_lg_qt, kind: generated_truth}
        diffstar_qlglgdt: {column: diffstar_qlglgdt, kind: generated_truth}
        diffstar_lg_drop: {column: diffstar_lg_drop, kind: generated_truth}
        diffstar_lg_rejuv: {column: diffstar_lg_rejuv, kind: generated_truth}
        diffmah_logm0: {column: diffmah_logm0, kind: generated_truth}
        diffmah_logtc: {column: diffmah_logtc, kind: generated_truth}
        diffmah_early_index: {column: diffmah_early_index, kind: generated_truth}
        diffmah_late_index: {column: diffmah_late_index, kind: generated_truth}
        diffmah_t_peak: {column: diffmah_t_peak, kind: generated_truth}
        dust_av: {column: dust_av, kind: generated_truth}
        dust_delta: {column: dust_delta, kind: generated_truth}
        logmp_true: logmp_true
        logssfr_true: logssfr_true
        logsfr_true: logsfr_true
        central_true: central_true

fit:
    maxiter: 220
    learning_rate: 0.02
    patience: 40
    free_parameters:
        z_obs:
            initial: from_base
            bounds: [0.001, 1.2]
        log10_stellar_mass:
            initial: 10.0
            bounds: [8.0, 12.2]
        diffstar_lgmcrit:
            initial: 11.6
            bounds: [9.5, 13.0]
        diffstar_lgy_at_mcrit:
            initial: -9.7
            bounds: [-11.2, -8.2]
        diffstar_indx_lo:
            initial: 0.7
            bounds: [0.0, 3.0]
        diffstar_indx_hi:
            initial: -2.3
            bounds: [-4.7, -0.8]
        diffstar_lg_qt:
            initial: 1.1
            bounds: [0.25, 2.05]
        diffstar_qlglgdt:
            initial: -0.08
            bounds: [-2.5, 0.0]
        diffstar_lg_drop:
            initial: -2.2
            bounds: [-3.1, 0.05]
        diffstar_lg_rejuv:
            initial: -2.0
            bounds: [-3.1, 0.05]
        diffmah_logm0:
            initial: 12.0
            bounds: [11.2, 15.0]
        diffmah_logtc:
            initial: 0.28
            bounds: [-1.0, 1.0]
        diffmah_early_index:
            initial: 2.4
            bounds: [0.1, 10.0]
        diffmah_late_index:
            initial: 0.13
            bounds: [0.1, 3.5]
        diffmah_t_peak:
            initial: 11.5
            bounds: [0.5, 13.9]
        dust_av:
            initial: 0.6
            bounds: [0.0, 4.0]
        dust_delta:
            initial: 0.0
            bounds: [-0.9, 0.5]
