catalog_path: "Data/Euclid FS2 LC galaxy catalog_phz1.parquet"
ssp_path: "Data/ssp_data_fsps_v3.2_lgmet_age.h5"

selection:
  index: 0
  require_positive_flux: true
  sort_by_flux:

eda:
  nrows:

extra_columns:
  - ra_gal
  - dec_gal
  - ra_mag_gal
  - dec_mag_gal
  - bulge_fraction
  - disk_r50
  - bulge_r50
  - eps1_gal
  - eps2_gal
  - disk_ellipticity
  - bulge_ellipticity
  - bulge_nsersic
  - disk_nsersic
  - lm_halo
  - lmbound_halo
  - r_halo
  - conc_vir_halo
  - rs_halo
  - rvir_halo
  - n_sats_halo
  - num_p_halo

redshift:
  column: phz_mode_1
  truth_column: true_redshift_halo
  fixed_value: 0.5
  min: 0.001
  max: 6.0

bands:
  - name: euclid_vis
    column: euclid_vis
    units: fnu_cgs
    sigma_mag: 0.05
    filter:
      kind: tophat
      wave_min: 5500
      wave_max: 9000
      n_wave: 700
  - name: euclid_nisp_y
    column: euclid_nisp_y
    units: fnu_cgs
    sigma_mag: 0.05
    filter:
      kind: hdf5
      path: filters/converted/euclid_nisp_y_throughput.h5
  - name: euclid_nisp_j
    column: euclid_nisp_j
    units: fnu_cgs
    sigma_mag: 0.05
    filter:
      kind: hdf5
      path: filters/converted/euclid_nisp_j_throughput.h5
  - name: euclid_nisp_h
    column: euclid_nisp_h
    units: fnu_cgs
    sigma_mag: 0.05
    filter:
      kind: hdf5
      path: filters/converted/euclid_nisp_h_throughput.h5

model:
  n_sfh_bins: 96
  fixed_parameters:
    log10_sfr: 0.0
    sfh_t_peak: 4.0
    sfh_tau: 0.6
    log10_metallicity: -2.0
    metallicity_scatter: 0.2
    dust_av: 0.2
    dust_slope: -0.7
  parameter_columns: {}

fit:
  method: jax_adam
  maxiter: 80
  learning_rate: 0.1
  tolerance: 1.0e-5
  patience: 18
  population:
    prior_weight: 1.0
    sigma_floor: 0.03
    hyper_mu_scale: 5.0
  free_parameters:
    log10_sfr:
      initial: 0.0
      bounds: [-3.0, 4.0]
    dust_av:
      initial: 0.2
      bounds: [0.0, 2.5]
    log10_metallicity:
      initial: -2.0
      bounds: [-4.2, -1.4]

truth:
  redshift_column: true_redshift_halo
  parameter_columns: {}
