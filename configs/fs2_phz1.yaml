catalog_path: "Data/Euclid FS2 LC galaxy catalog_phz1.parquet"
ssp_path: "Data/ssp_data_fsps_v3.2_lgmet_age.h5"

selection:
    index: 0
    require_positive_flux: true
    sort_by_flux:

eda:
    nrows:

extra_columns:
    - ra_gal
    - dec_gal
    - ra_mag_gal
    - dec_mag_gal
    - bulge_fraction
    - disk_r50
    - bulge_r50
    - eps1_gal
    - eps2_gal
    - disk_ellipticity
    - bulge_ellipticity
    - bulge_nsersic
    - disk_nsersic
    - lm_halo
    - lmbound_halo
    - r_halo
    - conc_vir_halo
    - rs_halo
    - rvir_halo
    - n_sats_halo
    - num_p_halo

redshift:
    column: z_phz
    truth_column: z_true
    fixed_value: 0.5
    min: 0.0001
    max: 6.0

bands:
    - name: euclid_vis
      column: euclid_vis
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_VIS.vis.dat
    - name: euclid_nisp_y
      column: euclid_nisp_y
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.Y.dat
    - name: euclid_nisp_j
      column: euclid_nisp_j
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.J.dat
    - name: euclid_nisp_h
      column: euclid_nisp_h
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          path: filters/Euclid_NISP.H.dat

model:
    n_sfh_bins: 96
    fixed_parameters:
        log10_sfr: 0.0
        sfh_t_peak: 4.0
        sfh_tau: 0.6
        log10_metallicity: -2.0
        metallicity_scatter: 0.2
        dust_av: 0.2
        dust_slope: -0.7
    parameter_columns: {}

fit:
    method: jax_adam
    maxiter: 80
    learning_rate: 0.1
    tolerance: 1.0e-5
    patience: 18
    population:
        prior_weight: 1.0
        sigma_floor: 0.03
        hyper_mu_scale: 5.0
    free_parameters:
        log10_sfr:
            initial: 0.0
            bounds: [-4.0, 3.0]
        dust_av:
            initial: 0.2
            bounds: [0.0, 1.0]
        log10_metallicity:
            initial: -2.25
            bounds: [-4.2, -1.4]

sample:
    sampler: nuts
    num_warmup: 100
    num_samples: 200
    num_chains: 1
    chain_method: parallel
    target_accept_prob: 0.85
    max_tree_depth: 10
    num_steps: 8
    dense_mass: false
    seed: 42
    progress_bar: true
    init_from_map: true
    save_samples: true
    priors:
        z_obs:
            type: truncated_normal
            loc: 0.5
            scale: 2.0
        log10_sfr:
            type: truncated_normal
            loc: 0.0
            scale: 1.75
        dust_av:
            type: truncated_normal
            loc: 0.2
            scale: 0.6
        log10_metallicity:
            type: truncated_normal
            loc: -2.0
            scale: 0.7

truth:
    redshift_column: z_true
    parameter_columns:
        log10_metallicity:
            column: metallicity_true
            offset: -10.61
        log10_sfr_at_obs: log_sfr_true
        dust_av:
            column: dust_ebv_true
            scale: 4.05
