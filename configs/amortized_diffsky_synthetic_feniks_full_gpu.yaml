extends: diffsky_synthetic_feniks_260617_50k.yaml

catalog_path: Data/diffsky/synthetic/feniks_260617_dsps_closure/train.parquet

amortized:
    data:
        expected_n_bands: 14
        selection_mode: sequential
        validation_fraction: 0.1
        catalog_batch_size: 10000
    latent:
        schema: diffsky_dsps_closure_full
        include_redshift: true
        use_fit_bounds: true
        normalization: identity
    features:
        type: flux_and_errors
        n_flux_bands: 14
        n_error_bands: 14
        normalize_per_band: true
        flux_transform: asinh
        error_transform: log
    encoder:
        type: gaussian_mlp
        input_dim: 28
        latent_dim: 18
        hidden_sizes: [512, 512, 512]
        activation: gelu
        log_std_min: -8.0
        log_std_max: 3.0
        initial_log_std: -1.0
    prior:
        type: realnvp
        source: supervised_checkpoint
        checkpoint: outputs/runs/prior_diffsky_synthetic_feniks_full_realnvp/checkpoints/best.eqx
        train_jointly: false
    likelihood:
        type: student_t
        student_t_dof: 2.0
        error_floor_frac: 0.02
        error_jitter: 0.0
    training:
        epochs: 100
        batch_size: 512
        n_samples: 4
        learning_rate: 1.0e-4
        weight_decay: 1.0e-5
        gradient_clip_norm: 1.0
        kl_annealing_epochs: 30
        kl_weight_max: 1.0
        validation_every: 1
        seed: 260717
    inference:
        posterior_samples: 256
        prior_samples: 8192
        decoder_sample_chunk_size: 1
        prior_predictive_batch_size: 256
