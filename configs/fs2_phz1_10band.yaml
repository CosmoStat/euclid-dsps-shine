catalog_path: "Data/Euclid FS2 LC galaxy catalog_phz1.parquet"
ssp_path: "Data/ssp_data_fsps_v3.2_lgmet_age.h5"

runtime:
    # WSL-safe default. For a working CUDA JAX install, use:
    # jax_platforms: "cuda,cpu"
    # disable_jax_plugin_autoload: false
    jax_platforms: "cuda,cpu"
    disable_jax_plugin_autoload: true
    xla_python_client_preallocate: false

selection:
    index: 8
    require_positive_flux: true
    sort_by_flux:

eda:
    nrows:

extra_columns:
    - ra_gal
    - dec_gal
    - ra_mag_gal
    - dec_mag_gal
    - sed_cosmos_1
    - sed_cosmos_2
    - frac_cosmos_1
    - frac_cosmos_2
    - color_kind
    - euclid_vis_abs
    - euclid_nisp_y_abs
    - euclid_nisp_j_abs
    - euclid_nisp_h_abs
    - euclid_vis_el_model3_ext
    - euclid_nisp_y_el_model3_ext
    - euclid_nisp_j_el_model3_ext
    - euclid_nisp_h_el_model3_ext
    - euclid_vis_el_model3_ext_odonnell_ext
    - euclid_nisp_y_el_model3_ext_odonnell_ext
    - euclid_nisp_j_el_model3_ext_odonnell_ext
    - euclid_nisp_h_el_model3_ext_odonnell_ext
    - euclid_vis_el_model3_ext_odonnell_ext_error
    - euclid_nisp_y_el_model3_ext_odonnell_ext_error
    - euclid_nisp_j_el_model3_ext_odonnell_ext_error
    - euclid_nisp_h_el_model3_ext_odonnell_ext_error
    - euclid_vis_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_y_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_j_el_model3_ext_odonnell_ext_error_realization
    - euclid_nisp_h_el_model3_ext_odonnell_ext_error_realization
    - ebv_cosmos_1
    - ebv_cosmos_2
    - ext_curve_cosmos_1
    - ext_curve_cosmos_2
    - mw_extinction
    - bulge_fraction
    - disk_r50
    - bulge_r50
    - eps1_gal
    - eps2_gal
    - disk_ellipticity
    - bulge_ellipticity
    - bulge_nsersic
    - disk_nsersic
    - lm_halo
    - lmbound_halo
    - r_halo
    - conc_vir_halo
    - rs_halo
    - rvir_halo
    - n_sats_halo
    - num_p_halo

cosmos_sed:
    lephare_data_dir: "/home/maxime/.cache/lephare/data"
    template_subdir: "sed/GAL/COSMOS_SED"
    template_list: "COSMOS_MOD.list"
    expected_template_count: 31
    template_wave_unit: angstrom
    template_flux_unit: arbitrary_flambda
    extinction_dir: "ext"
    extinction:
        curves:
            0: none
            1: SMC_prevot
            2: SB_calzetti
            3: SB_calzetti_bump1
            4: SB_calzetti_bump2
    component_fraction_policy: strict
    filter_response_kind: photon
    comparison_wave_min_angstrom: 1000.0
    comparison_wave_max_angstrom: 30000.0
    sample_plot_count: 12
    observed_photometry_target_sets:
        - continuum_internal_dust
    use_cosmos_dust_in_dsps: true

redshift:
    column: z_phz
    truth_column: z_true
    fixed_value: 0.5
    min: 0.0001
    max: 6.0

bands:
    - name: lsst_u
      column: lsst_u
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: lsst_g
      column: lsst_g
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: lsst_r
      column: lsst_r
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: lsst_i
      column: lsst_i
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: lsst_z
      column: lsst_z
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: lsst_y
      column: lsst_y
      units: fnu_cgs
      sigma_mag: 0.05
      filter:
          kind: auto
    - name: euclid_vis
      column: euclid_vis
      units: fnu_cgs
      sigma_mag: 0.05
      error_column: euclid_vis_el_model3_ext_odonnell_ext_error
      error_units: fnu_cgs
      sigma_mag_floor: 0.01
      sigma_mag_ceiling: 0.5
      filter:
          path: filters/Euclid_VIS.vis.dat
    - name: euclid_nisp_y
      column: euclid_nisp_y
      units: fnu_cgs
      sigma_mag: 0.05
      error_column: euclid_nisp_y_el_model3_ext_odonnell_ext_error
      error_units: fnu_cgs
      sigma_mag_floor: 0.01
      sigma_mag_ceiling: 0.5
      filter:
          path: filters/Euclid_NISP.Y.dat
    - name: euclid_nisp_j
      column: euclid_nisp_j
      units: fnu_cgs
      sigma_mag: 0.05
      error_column: euclid_nisp_j_el_model3_ext_odonnell_ext_error
      error_units: fnu_cgs
      sigma_mag_floor: 0.01
      sigma_mag_ceiling: 0.5
      filter:
          path: filters/Euclid_NISP.J.dat
    - name: euclid_nisp_h
      column: euclid_nisp_h
      units: fnu_cgs
      sigma_mag: 0.05
      error_column: euclid_nisp_h_el_model3_ext_odonnell_ext_error
      error_units: fnu_cgs
      sigma_mag_floor: 0.01
      sigma_mag_ceiling: 0.5
      filter:
          path: filters/Euclid_NISP.H.dat

model:
    n_sfh_bins: 96
    fixed_parameters:
        log10_sfr: 0.0
        sfh_t_peak: 4.0
        sfh_tau: 0.6
        sfh_burst_fraction: 0.0
        sfh_burst_time: 1.0
        sfh_burst_width: 0.12
        sfh_quench_time: 12.0
        sfh_quench_width: 0.5
        sfh_quench_depth: 0.0
        log10_metallicity: -2.0
        metallicity_scatter: 0.2
        dust_slope: -0.7
        cosmos_ebv_1: 0.0
        cosmos_ebv_2: 0.0
        cosmos_frac_1: 0.5
        cosmos_frac_2: 0.5
        cosmos_ext_curve_1: 0.0
        cosmos_ext_curve_2: 0.0
    parameter_columns:
        cosmos_ebv_1: ebv_cosmos_1
        cosmos_ebv_2: ebv_cosmos_2
        cosmos_frac_1: frac_cosmos_1
        cosmos_frac_2: frac_cosmos_2
        cosmos_ext_curve_1: ext_curve_cosmos_1
        cosmos_ext_curve_2: ext_curve_cosmos_2

fit:
    method: jax_adam
    maxiter: 200
    learning_rate: 0.08
    tolerance: 1.0e-5
    patience: 24
    prior_weight: 1.0
    population:
        prior_weight: 1.0
        sigma_floor: 0.03
        hyper_mu_scale: 5.0
    priors:
        z_obs:
            type: truncated_normal
            loc: from_base
            scale: 0.12
        log10_sfr:
            type: normal
            loc: 0.0
            scale: 1.5
        sfh_t_peak:
            type: normal
            loc: 4.0
            scale: 3.0
        sfh_tau:
            type: normal
            loc: 0.8
            scale: 0.8
        sfh_burst_fraction:
            type: scaled_beta
            alpha: 1.0
            beta: 4.0
        sfh_burst_time:
            type: normal
            loc: 4.0
            scale: 4.0
        sfh_quench_time:
            type: normal
            loc: 9.0
            scale: 4.0
        sfh_quench_depth:
            type: scaled_beta
            alpha: 1.0
            beta: 2.0
        log10_metallicity:
            type: normal
            loc: -2.4
            scale: 0.6
    free_parameters:
        z_obs:
            initial: from_base
            bounds: [0.001, 6.0]
        log10_sfr:
            initial: 0.0
            bounds: [-4.5, 2.8]
        sfh_t_peak:
            initial: 4.0
            bounds: [0.1, 13.5]
        sfh_tau:
            initial: 0.6
            bounds: [0.08, 4.0]
        sfh_burst_fraction:
            initial: 0.0
            bounds: [0.0, 3.0]
        sfh_burst_time:
            initial: 1.0
            bounds: [0.05, 13.5]
        sfh_quench_time:
            initial: 12.0
            bounds: [0.05, 13.5]
        sfh_quench_depth:
            initial: 0.0
            bounds: [0.0, 1.0]
        log10_metallicity:
            initial: -2.25
            bounds: [-3.9, -1.6]

sample:
    sampler: nuts
    num_warmup: 100
    num_samples: 200
    num_chains: 1
    chain_method: parallel
    target_accept_prob: 0.85
    max_tree_depth: 10
    num_steps: 8
    dense_mass: false
    seed: 42
    progress_bar: true
    init_from_map: true
    save_samples: true
    priors:
        z_obs:
            type: truncated_normal
            loc: from_base
            scale: 0.15
        log10_sfr:
            type: truncated_normal
            loc: 0.0
            scale: 1.3
        dust_av:
            type: scaled_beta
            alpha: 1.2
            beta: 3.0
        log10_metallicity:
            type: uniform

truth:
    redshift_column: z_true
    parameter_columns:
        log10_metallicity:
            column: metallicity_true
            offset: -10.61
        log10_sfr_at_obs: log_sfr_true
        dust_av:
            column: dust_ebv_true
            scale: 4.05
